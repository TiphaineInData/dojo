<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Python - Quiz Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        body { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h2 { margin-top: 30px; color: #333; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
        pre code { display: block; padding: 15px; overflow-x: auto; }
    </style>
</head>
<body>
    <div id="content">Chargement des instructions en cours...</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('README.md')
            .then(response => {
                if (!response.ok) throw new Error('Fichier README.md introuvable');
                return response.text();
            })
            .then(text => {
                // On retire proprement le bloc de configuration du début (front-matter)
                const cleanText = text.replace(/^---[\s\S]*?---/, '');
                document.getElementById('content').innerHTML = marked.parse(cleanText);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<p style="color:red;">Erreur : ${err.message}. Assurez-vous que le fichier s'appelle bien README.md</p>`;
            });
    </script>
</body>
</html>
